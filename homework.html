<!DOCTYPE html>
<html>
<head>
  <title>Google Docs</title>
  <link rel="icon" href="https://nearpod.gq/static-assets/favicon-presets/docs.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Verdana', sans-serif;
      background-color: #f8f9fa;
      overflow: hidden;
    }
    #content-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    #content-display {
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
    }
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 18px;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    #error-message {
      color: #d32f2f;
      background-color: #ffebee;
      padding: 10px;
      margin: 10px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="content-container">
    <div id="error-message"></div>
    <div id="content-display" class="loading">
      Loading content...
    </div>
  </div>

  <script>
    const contentDisplay = document.getElementById('content-display');
    const errorMessage = document.getElementById('error-message');

    const username = "hungryhippo99999";
    let currentPage = "media"; // default page

    async function fetchAndRenderContent(page) {
      contentDisplay.classList.add('loading');
      contentDisplay.innerHTML = 'Loading content...';
      errorMessage.style.display = 'none';

      try {
        const url = `https://${username}.github.io/${page}.html`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Failed to fetch content (Status: ${response.status})`);
        }

        const htmlContent = await response.text();

        const iframe = document.createElement('iframe');
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';

        contentDisplay.innerHTML = '';
        contentDisplay.classList.remove('loading');
        contentDisplay.appendChild(iframe);

        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(htmlContent);
        iframeDoc.close();

        currentPage = page;

      } catch (error) {
        console.error('Error fetching content:', error);
        errorMessage.textContent = `Error: ${error.message}`;
        errorMessage.style.display = 'block';
        contentDisplay.innerHTML = '';
        contentDisplay.classList.remove('loading');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchAndRenderContent(currentPage);
    });
  </script>
</body>
</html>
